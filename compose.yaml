# Точка входа локального стека Personal AI Hub (Этап 1).
# Сервисы: web (Next.js), api (FastAPI), worker (Celery), postgres, valkey, qdrant.
# Все образы используют конкретные версии, без `latest`.

name: personal-ai-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BIND_HOST: 0.0.0.0
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY обязателен}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:${POSTGRES_PASSWORD}@postgres:5432/app}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      BLOB_STORE_DRIVER: ${BLOB_STORE_DRIVER:-local}
      BLOB_LOCAL_ROOT: ${BLOB_LOCAL_ROOT:-/data/assets}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VECTOR_STORE_DRIVER: ${VECTOR_STORE_DRIVER:-qdrant}
      # OCR-настройки из .env: без явной передачи контейнер их не видит, и
      # значения из документации (OCR_BACKEND и лимиты) не применяются.
      OCR_BACKEND: ${OCR_BACKEND:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus,eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-40}
      OCR_MAX_IMAGE_SIDE: ${OCR_MAX_IMAGE_SIDE:-3500}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-50000000}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-30.0}
      # Веб-поиск (ADR-0005): выключен, пока WEB_SEARCH_ENABLED=0.
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-0}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-10.0}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_MAX_CONTEXT_CHARS: ${WEB_SEARCH_MAX_CONTEXT_CHARS:-2000}
      WEB_SEARCH_ENGINES: ${WEB_SEARCH_ENGINES:-}
      # Опциональное автосоздание администратора при пустой БД.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - assets:/data/assets
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app:app", "worker", "--loglevel=${LOG_LEVEL:-INFO}"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY обязателен}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:${POSTGRES_PASSWORD}@postgres:5432/app}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      BLOB_STORE_DRIVER: ${BLOB_STORE_DRIVER:-local}
      BLOB_LOCAL_ROOT: ${BLOB_LOCAL_ROOT:-/data/assets}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Worker выполняет OCR при индексации: настройки нужны и здесь.
      OCR_BACKEND: ${OCR_BACKEND:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus,eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-40}
      OCR_MAX_IMAGE_SIDE: ${OCR_MAX_IMAGE_SIDE:-3500}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-50000000}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-30.0}
    volumes:
      - assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app:app", "beat", "--loglevel=${LOG_LEVEL:-INFO}"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY обязателен}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:${POSTGRES_PASSWORD}@postgres:5432/app}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Next.js standalone читает HOSTNAME; переопределяем авто-HOSTNAME Docker,
      # чтобы сервер слушал на 0.0.0.0 (иначе healthcheck внутри контейнера падает).
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# Опциональный LiteLLM proxy (ADR-0004). По умолчанию НЕ запускается:
  # включается только профилем `docker compose --profile litellm up -d litellm`.
  # Personal AI Hub обращается к нему как к обычному OpenAI-совместимому
  # провайдеру (`provider_type=litellm_proxy`), поэтому в backend не ставится
  # ни библиотека litellm, ни её зависимости.
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    profiles: ["litellm"]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Без ключа proxy не стартует: это ожидаемо и не влияет на основной стек.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_UPSTREAM_API_KEY: ${LITELLM_UPSTREAM_API_KEY:-}
      LITELLM_UPSTREAM_API_BASE: ${LITELLM_UPSTREAM_API_BASE:-}
      LITELLM_UPSTREAM_MODEL: ${LITELLM_UPSTREAM_MODEL:-}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      # Слушаем только localhost: внешний доступ к прокси не выставляем.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

# Опциональный SearXNG для веб-поиска (ADR-0005). По умолчанию НЕ запускается:
  # включается профилем `docker compose --profile search up -d searxng`.
  # Локальный meta-поисковик: не требует API-ключей и не отправляет запросы
  # третьим лицам сверх самих поисковых движков. Backend обращается к нему по
  # внутренней сети (`SEARXNG_URL`), поэтому порт публикуется только на
  # localhost — для отладки.
  searxng:
    # Тег зафиксирован по дате сборки (проверен в реестре: тег существует,
    # есть сборки amd64/arm64/armv7). `latest` не используем — см. ADR-0001.
    image: searxng/searxng:2026.10.13-22c64b8d3
    profiles: ["search"]
    restart: unless-stopped
    environment:
      # Ключ сессий SearXNG; при отсутствии будет сгенерирован случайный.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      # Базовый адрес, по которому SearXNG строит ссылки.
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_PORT:-8888}/
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      # Слушаем только localhost: наружу поисковый сервис не выставляем.
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  valkeydata:
  qdrantdata:
  assets:
